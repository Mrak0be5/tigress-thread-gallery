<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Tigress thread gallery</title>
  <style>
    :root {
      --bg: #0d0f12;
      --panel: #161a20;
      --border: #2a313c;
      --text: #e8ecf1;
      --muted: #9aa3b2;
      --accent: #7c9cff;
      --ok: #3ecf8e;
      --sheet: #e8c547;
      --scene: #ff8a65;
      --bunny: #c77dff;
      --identity: #64b5f6;
      --story: #f4d35e;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1a2233 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
    }
    header {
      padding: 2rem 1.25rem 0.75rem;
      max-width: 1280px;
      margin: 0 auto;
    }
    header h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.4rem, 2.5vw, 1.95rem);
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    header p { margin: 0.25rem 0; color: var(--muted); font-size: 0.95rem; }
    .badges { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.85rem; }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.75rem;
      color: var(--muted);
      background: rgba(255,255,255,0.03);
    }
    nav {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0.75rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(13,15,18,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    nav button {
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.4rem 0.85rem;
      font-size: 0.85rem;
      cursor: pointer;
    }
    nav button:hover, nav button.active { border-color: var(--accent); color: #fff; }
    nav button[data-cat="sheet"].active { border-color: var(--sheet); color: var(--sheet); }
    nav button[data-cat="scene"].active { border-color: var(--scene); color: var(--scene); }
    nav button[data-cat="bunny"].active { border-color: var(--bunny); color: var(--bunny); }
    nav button[data-cat="identity"].active { border-color: var(--identity); color: var(--identity); }
    nav button[data-cat="video"].active { border-color: #ff5252; color: #ff5252; }
    nav button[data-cat="story"].active { border-color: var(--story); color: var(--story); }
    nav button[data-cat="liked"].active { border-color: #ff6b9a; color: #ff6b9a; }
    .net-bar {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0.55rem 1.25rem 0.75rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }
    .net-bar .lbl { color: var(--muted); font-size: 0.8rem; margin-right: 0.15rem; }
    .net-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--text);
      background: rgba(62, 207, 142, 0.08);
      border: 1px solid var(--ok);
      border-radius: 999px;
      padding: 0.32rem 0.75rem;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .net-btn .mark {
      width: 1.05rem;
      height: 1.05rem;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1;
    }
    .net-btn.on .mark { background: var(--ok); color: #0d0f12; }
    .net-btn.off {
      background: rgba(255, 82, 82, 0.08);
      border-color: #ff5252;
      color: var(--muted);
      text-decoration: line-through;
    }
    .net-btn.off .mark { background: #ff5252; color: #fff; }
    .like-btn {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      border-radius: 8px;
      padding: 0.25rem 0.55rem;
      font-size: 0.76rem;
      cursor: pointer;
    }
    .like-btn:hover { border-color: #ff6b9a; color: #fff; }
    .like-btn.on {
      border-color: #ff6b9a;
      color: #ff6b9a;
      background: rgba(255, 107, 154, 0.12);
    }
    .stories-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    .story-card {
      max-width: 640px;
      flex-direction: row;
      align-items: stretch;
    }
    .story-card .story-mark {
      width: 6px;
      background: var(--story);
      flex-shrink: 0;
    }
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1rem 1.25rem 3rem;
    }
    section { margin-top: 1.5rem; }
    section h2 {
      margin: 0 0 0.9rem;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .card:hover { border-color: #3d4a60; transform: translateY(-2px); }
    .card.best { border-color: color-mix(in srgb, var(--ok) 55%, var(--border)); }
    .thumb {
      aspect-ratio: 1 / 1;
      background: #0a0c10;
      cursor: zoom-in;
      overflow: hidden;
      position: relative;
    }
    .video-card .thumb {
      aspect-ratio: auto;
      cursor: default;
    }
    .thumb img, .thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .video-card .thumb video, .video-card .thumb img {
      height: auto;
      object-fit: contain;
      max-height: 80vh;
    }
    @media (min-width: 640px) {
      .video-card {
        grid-column: span 2;
      }
    }
    .view-badge {
      position: absolute;
      top: 0.5rem;
      left: 0.5rem;
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      pointer-events: none;
    }
    .toggle {
      display: flex;
      gap: 0;
      margin: 0;
      padding: 0;
      border-bottom: 1px solid var(--border);
      background: #12161c;
    }
    .toggle button {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 0.55rem 0.4rem;
      font-size: 0.8rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .toggle button:hover { color: var(--text); }
    .toggle button.active {
      color: #fff;
      border-bottom-color: var(--accent);
      background: rgba(124, 156, 255, 0.08);
    }
    .toggle button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .meta { padding: 0.85rem 0.95rem 1rem; display: flex; flex-direction: column; gap: 0.3rem; flex: 1; }
    .meta h3 { margin: 0; font-size: 0.95rem; font-weight: 600; }
    .model {
      font-size: 0.78rem;
      color: var(--accent);
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    }
    .note { font-size: 0.82rem; color: var(--muted); }
    .note.ok { color: var(--ok); }
    .refs {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-top: 0.35rem;
    }
    .refs figure {
      margin: 0;
      width: 72px;
    }
    .refs img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: zoom-in;
      display: block;
      background: #0a0c10;
    }
    .refs figcaption {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 0.15rem;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .prompt-box {
      margin-top: 0.4rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0a0c10;
      padding: 0.35rem 0.5rem;
    }
    .prompt-box summary {
      cursor: pointer;
      font-size: 0.76rem;
      color: var(--accent);
      user-select: none;
    }
    .prompt-box pre {
      margin: 0.4rem 0 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.72rem;
      color: var(--text);
      max-height: 14rem;
      overflow: auto;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    }
    .services {
      margin-top: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .service {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      padding: 0.65rem 0.8rem;
      font-size: 0.82rem;
    }
    .service a { color: var(--accent); }
    .api-key {
      margin-top: 0.35rem;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 0.72rem;
      word-break: break-all;
      color: var(--text);
    }
    .row { display: flex; gap: 0.45rem; flex-wrap: wrap; margin-top: 0.35rem; }
    a.btn {
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.25rem 0.5rem;
      font-size: 0.76rem;
      background: rgba(255,255,255,0.03);
    }
    a.btn:hover { border-color: var(--accent); color: #fff; }
    footer {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1.25rem 2.5rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .lb {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.92);
      display: none; align-items: center; justify-content: center;
      z-index: 50; padding: 1rem; cursor: zoom-out;
    }
    .lb.open { display: flex; }
    .lb img {
      max-width: min(96vw, 1400px);
      max-height: 92vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.6);
      cursor: default;
    }
    .lb .close {
      position: fixed; top: 1rem; right: 1rem;
      color: #fff; border: 1px solid #444; background: #111;
      border-radius: 999px; width: 2.2rem; height: 2.2rem;
      font-size: 1.2rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>Tigress thread gallery</h1>
    <p>Генерации тигрицы + оригинальные референсы поз. Под карточкой: переключатель <strong>Тигрица / Поза</strong>.</p>
    <p>Сортировка: <strong>новые сверху</strong>.</p>
    <div class="badges">
      <span class="badge" id="count-badge">loading…</span>
      <span class="badge" id="updated-badge"></span>
      <span class="badge">NSFW 18+</span>
    </div>
    <div id="services" class="services"></div>
  </header>

  <nav id="nav">
    <button type="button" data-cat="all" class="active">Все</button>
    <button type="button" data-cat="sheet">Sheets</button>
    <button type="button" data-cat="scene">Scenes</button>
    <button type="button" data-cat="identity">Identity</button>
    <button type="button" data-cat="bunny">Bunny</button>
    <button type="button" data-cat="video">Video</button>
    <button type="button" data-cat="story">Рассказы</button>
    <button type="button" data-cat="liked">Лайки</button>
    <button type="button" data-cat="best">Best</button>
  </nav>
  <div class="net-bar" id="net-bar">
    <span class="lbl">Нейросети:</span>
    <button type="button" class="net-btn on" data-net="wan" aria-pressed="true"><span class="mark">✓</span> Wan</button>
    <button type="button" class="net-btn on" data-net="seedream" aria-pressed="true"><span class="mark">✓</span> Seedream</button>
    <button type="button" class="net-btn on" data-net="minimax" aria-pressed="true"><span class="mark">✓</span> MiniMax</button>
  </div>

  <main id="main"></main>

  <footer>
    Local: <code>C:\Users\hebp\galleries\tigress-thread-gallery</code>
    · push: <code>scripts/publish-add.py --pose path</code>
    · noindex
  </footer>

  <div class="lb" id="lb" aria-hidden="true">
    <button class="close" id="lb-close" type="button" aria-label="Close">×</button>
    <img id="lb-img" alt="" />
  </div>

  <script>
    const CATS = [
      { id: "sheet", title: "Character sheets / 3-view" },
      { id: "scene", title: "Scenes (sex poses)" },
      { id: "identity", title: "Identity crops" },
      { id: "bunny", title: "Bunny" },
      { id: "video", title: "Videos" },
      { id: "story", title: "Рассказы" }
    ];
    let DATA = null;
    let filter = (location.hash === "#story" || location.hash === "#stories") ? "story" : "all";
    /** per-card view: "tigress" | "pose" */
    const viewState = new Map();
    const LIKES_KEY = "tigress-gallery-likes";
    const NET_KEY = "tigress-gallery-nets";
    const NETS = ["wan", "seedream", "minimax"];
    let likes = new Set();
    let netsOn = { wan: true, seedream: true, minimax: true };

    function loadLikes() {
      try {
        const raw = JSON.parse(localStorage.getItem(LIKES_KEY) || "[]");
        likes = new Set(Array.isArray(raw) ? raw.map(String) : []);
      } catch (e) {
        likes = new Set();
      }
    }
    function saveLikes() {
      localStorage.setItem(LIKES_KEY, JSON.stringify([...likes]));
    }
    function loadNets() {
      try {
        const raw = JSON.parse(localStorage.getItem(NET_KEY) || "null");
        if (raw && typeof raw === "object") {
          NETS.forEach((k) => { if (typeof raw[k] === "boolean") netsOn[k] = raw[k]; });
        }
      } catch (e) {}
    }
    function saveNets() {
      localStorage.setItem(NET_KEY, JSON.stringify(netsOn));
    }
    function syncNetButtons() {
      document.querySelectorAll("#net-bar .net-btn").forEach((btn) => {
        const k = btn.dataset.net;
        const on = netsOn[k] !== false;
        btn.classList.toggle("on", on);
        btn.classList.toggle("off", !on);
        btn.setAttribute("aria-pressed", on ? "true" : "false");
        const mark = btn.querySelector(".mark");
        if (mark) mark.textContent = on ? "✓" : "✕";
      });
    }
    function isLiked(id) {
      return likes.has(String(id));
    }
    function toggleLike(id) {
      id = String(id);
      if (likes.has(id)) likes.delete(id);
      else likes.add(id);
      saveLikes();
    }
    function netFamily(it) {
      const blob = [
        it.model, it.service, it.service_url, it.id, it.note, it.category
      ].map((x) => String(x || "").toLowerCase()).join(" ");
      if (/\bwan\b|wavespeed|alibaba\/wan/.test(blob)) return "wan";
      if (/seedream|kie\.ai|kieai/.test(blob)) return "seedream";
      if (/minimax|fl2va|ref2va|\bh3\b/.test(blob)) return "minimax";
      return "other";
    }
    function netAllowed(it) {
      const fam = netFamily(it);
      if (fam === "other") return true;
      return netsOn[fam] !== false;
    }
    function plural(n, one, few, many) {
      const n10 = Math.abs(n) % 10;
      const n100 = Math.abs(n) % 100;
      if (n10 === 1 && n100 !== 11) return one;
      if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return few;
      return many;
    }
    function relativeAgo(ms) {
      if (!ms) return "";
      const diff = Date.now() - ms;
      if (diff < 0) return "только что";
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return "только что";
      if (mins < 60) return mins + " " + plural(mins, "минуту", "минуты", "минут") + " назад";
      const hours = Math.floor(mins / 60);
      if (hours < 24) return hours + " " + plural(hours, "час", "часа", "часов") + " назад";
      const days = Math.floor(hours / 24);
      return days + " " + plural(days, "день", "дня", "дней") + " назад";
    }
    function whenHtml(it) {
      const ms = itemTime(it);
      if (!ms) return "";
      const label = relativeAgo(ms);
      const title = it.date || it.created || "";
      return `<div class="note ago" style="opacity:.85" data-ms="${ms}" title="${escapeHtml(title)}">${escapeHtml(label)}</div>`;
    }
    function likeBtnHtml(id) {
      const on = isLiked(id);
      return `<button type="button" class="like-btn ${on ? "on" : ""}" data-like="${escapeHtml(id)}" aria-pressed="${on ? "true" : "false"}">${on ? "♥ Лайк" : "♡ Лайк"}</button>`;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function itemTime(it) {
      const raw = it.date || it.created || "";
      const t = Date.parse(String(raw).replace(" ", "T"));
      return Number.isFinite(t) ? t : 0;
    }

    function sortNewestFirst(list) {
      return list.slice().sort((a, b) => itemTime(b) - itemTime(a));
    }

    function isStory(it) {
      return (it.category || "") === "story";
    }

    function storyCardHtml(item) {
      const ver = item.version ? "v" + item.version : "рассказ";
      const when = whenHtml(item);
      const href = item.html || "story.html";
      return `
        <article class="card story-card" data-id="${escapeHtml(item.id)}">
          <div class="story-mark"></div>
          <div class="meta">
            <h3>${escapeHtml(item.title || "Рассказ")}</h3>
            <div class="model">${escapeHtml(ver)} · ${escapeHtml(item.model || "проза")}</div>
            ${when}
            <div class="note">${escapeHtml(item.note || "")}</div>
            <div class="row">
              <a class="btn" href="${escapeHtml(href)}">Читать</a>
              <a class="btn" href="${escapeHtml(item.file)}" target="_blank" rel="noopener">MD</a>
              ${likeBtnHtml(item.id)}
            </div>
          </div>
        </article>`;
    }

    function cardHtml(item) {
      const best = item.flag === "best";
      const noteClass = best || /лучш|best|final|correct|identity lock/i.test(item.note || "") ? "ok" : "";
      const when = whenHtml(item);
      const hasPose = Boolean(item.pose);
      const mode = viewState.get(item.id) || "tigress";
      const src = mode === "pose" && hasPose ? item.pose : item.file;
      const badge = mode === "pose" ? "Поза (реф)" : "Тигрица";
      
      const isVideo = src.endsWith('.mp4');
      const mediaHtml = isVideo 
        ? `<video class="card-img" src="${escapeHtml(src)}" controls preload="metadata" loop style="object-fit:cover;"></video>`
        : `<img class="card-img" src="${escapeHtml(src)}" alt="${escapeHtml(item.title)}" loading="lazy" />`;
      const clickAction = isVideo ? "" : `data-src="${escapeHtml(src)}" title="Open full size"`;
      const refs = Array.isArray(item.refs) ? item.refs : [];
      const refsHtml = refs.length
        ? `<div class="refs">${refs.map((r) => {
            const rsrc = r.file || r.source || r.url || "";
            if (!rsrc) return "";
            return `<figure><img class="ref-thumb" src="${escapeHtml(rsrc)}" alt="${escapeHtml(r.label || "ref")}" title="${escapeHtml(r.label || "")}" data-src="${escapeHtml(rsrc)}" loading="lazy" /><figcaption>${escapeHtml(r.label || "")}</figcaption></figure>`;
          }).join("")}</div>`
        : "";
      const promptHtml = item.prompt
        ? `<details class="prompt-box"><summary>Промпт</summary><pre>${escapeHtml(item.prompt)}</pre></details>`
        : "";
      const svcName = item.service || "";
      const svcUrl = item.service_url || "";
      const svcModel = item.service_model_url || "";
      const apiUrl = item.api || "";
      const apiKey = item.api_key || "";
      const keyName = item.key_name || "";
      const svcHtml = (svcName || svcUrl || apiKey)
        ? `<div class="note">Сервис: ${svcUrl ? `<a class="btn" href="${escapeHtml(svcUrl)}" target="_blank" rel="noopener">${escapeHtml(svcName || "link")}</a>` : escapeHtml(svcName)}${svcModel ? ` <a class="btn" href="${escapeHtml(svcModel)}" target="_blank" rel="noopener">модель</a>` : ""}${apiUrl ? ` <a class="btn" href="${escapeHtml(apiUrl)}" target="_blank" rel="noopener">API</a>` : ""}</div>${apiKey ? `<details class="prompt-box"><summary>API key${keyName ? " · " + escapeHtml(keyName) : ""}</summary><pre>${escapeHtml(apiKey)}</pre></details>` : ""}`
        : "";
      
      return `
        <article class="card ${best ? "best" : ""} ${isVideo ? "video-card" : ""}" data-id="${escapeHtml(item.id)}" data-file="${escapeHtml(item.file)}" data-pose="${escapeHtml(item.pose || "")}">
          <div class="thumb" ${clickAction}>
            ${mediaHtml}
            <span class="view-badge">${badge}</span>
          </div>
          <div class="toggle" role="tablist" aria-label="Тигрица или поза">
            <button type="button" data-mode="tigress" class="${mode === "tigress" ? "active" : ""}">Тигрица</button>
            <button type="button" data-mode="pose" class="${mode === "pose" ? "active" : ""}" ${hasPose ? "" : "disabled"} title="${hasPose ? "Оригинал позы" : "Реф позы нет"}">Поза</button>
          </div>
          <div class="meta">
            <h3>${escapeHtml(item.title)}</h3>
            <div class="model">${escapeHtml(item.model || "")}</div>
            ${when}
            <div class="note ${noteClass}">${escapeHtml(item.note || "")}</div>
            ${refsHtml}
            ${promptHtml}
            ${svcHtml}
            <div class="row">
              <a class="btn open-link" href="${escapeHtml(src)}" target="_blank" rel="noopener">Open</a>
              ${likeBtnHtml(item.id)}
            </div>
          </div>
        </article>`;
    }

    function setCardMode(card, mode) {
      const id = card.dataset.id;
      const file = card.dataset.file;
      const pose = card.dataset.pose;
      if (mode === "pose" && !pose) return;
      viewState.set(id, mode);
      const src = mode === "pose" ? pose : file;
      const isVideo = src.endsWith('.mp4');
      const thumb = card.querySelector(".thumb");
      
      const mediaHtml = isVideo 
        ? `<video class="card-img" src="${escapeHtml(src)}" controls preload="metadata" loop style="object-fit:cover; width:100%; height:100%; display:block;"></video>`
        : `<img class="card-img" src="${escapeHtml(src)}" alt="Media" loading="lazy" />`;
      
      // We need to keep the badge when replacing innerHTML or just replace the media tag.
      let mediaEl = card.querySelector(".card-img");
      if (mediaEl) {
        if ((isVideo && mediaEl.tagName === 'IMG') || (!isVideo && mediaEl.tagName === 'VIDEO')) {
            mediaEl.outerHTML = mediaHtml;
        } else {
            mediaEl.src = src;
        }
      }

      const badge = card.querySelector(".view-badge");
      const open = card.querySelector(".open-link");
      
      if (thumb) {
        if (isVideo) {
            thumb.removeAttribute("data-src");
            thumb.removeAttribute("title");
            thumb.style.cursor = "default";
        } else {
            thumb.dataset.src = src;
            thumb.title = "Open full size";
            thumb.style.cursor = "zoom-in";
        }
      }
      
      if (badge) badge.textContent = mode === "pose" ? "Поза (реф)" : "Тигрица";
      if (open) open.href = src;
      card.querySelectorAll(".toggle button").forEach(b => {
        b.classList.toggle("active", b.dataset.mode === mode);
      });
    }

    function render() {
      const main = document.getElementById("main");
      const items = sortNewestFirst(DATA.items || []);
      main.innerHTML = "";
      const stories = items.filter(isStory).filter(netAllowed);
      const media = items.filter(it => !isStory(it)).filter(netAllowed);

      if (filter === "story") {
        const sec = document.createElement("section");
        sec.id = "stories";
        sec.innerHTML = `<h2>Рассказы <span style="color:var(--muted);font-weight:400;font-size:0.9rem">(${stories.length})</span></h2>
          <div class="stories-grid">${stories.map(storyCardHtml).join("")}</div>`;
        main.appendChild(sec);
        bindLikeButtons(main);
        return;
      }

      if (filter === "all" && stories.length) {
        const latest = stories.find(it => it.latest) || stories[0];
        const sec = document.createElement("section");
        sec.id = "stories";
        sec.innerHTML = `<h2>Рассказы <span style="color:var(--muted);font-weight:400;font-size:0.9rem">(последняя версия)</span></h2>
          <div class="stories-grid">${storyCardHtml(latest)}</div>`;
        main.appendChild(sec);
      }

      if (filter === "liked") {
        const likedStories = stories.filter((it) => isLiked(it.id));
        if (likedStories.length) {
          const sec = document.createElement("section");
          sec.id = "stories";
          sec.innerHTML = `<h2>Рассказы <span style="color:var(--muted);font-weight:400;font-size:0.9rem">(${likedStories.length})</span></h2>
            <div class="stories-grid">${likedStories.map(storyCardHtml).join("")}</div>`;
          main.appendChild(sec);
        }
      }

      const match = (it) => {
        if (filter === "liked") return isLiked(it.id);
        if (filter === "all") return true;
        if (filter === "best") return it.flag === "best";
        return (it.category || "") === filter;
      };

      const group = media.filter(match);
      const withPose = group.filter(it => it.pose).length;
      const sec = document.createElement("section");
      const title =
        filter === "all" ? "По дате (новые сверху)"
        : filter === "best" ? "Best of thread"
        : filter === "liked" ? "Лайки"
        : (CATS.find(c => c.id === filter)?.title || filter);
      sec.innerHTML = `<h2>${escapeHtml(title)} <span style="color:var(--muted);font-weight:400;font-size:0.9rem">(${group.length}, с рефом позы: ${withPose})</span></h2>
        <div class="grid">${group.map(cardHtml).join("")}</div>`;
      main.appendChild(sec);

      main.querySelectorAll(".thumb[data-src]").forEach(el => {
        el.addEventListener("click", () => {
          if (el.dataset.src) openLb(el.dataset.src);
        });
      });
      main.querySelectorAll(".toggle button").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (btn.disabled) return;
          const card = btn.closest(".card");
          setCardMode(card, btn.dataset.mode);
        });
      });
      main.querySelectorAll(".ref-thumb[data-src]").forEach(el => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          if (el.dataset.src) openLb(el.dataset.src);
        });
      });
      bindLikeButtons(main);
    }

    function bindLikeButtons(root) {
      root.querySelectorAll(".like-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const id = btn.dataset.like;
          if (!id) return;
          toggleLike(id);
          const on = isLiked(id);
          btn.classList.toggle("on", on);
          btn.setAttribute("aria-pressed", on ? "true" : "false");
          btn.textContent = on ? "♥ Лайк" : "♡ Лайк";
          if (filter === "liked" && !on) render();
        });
      });
    }

    async function load() {
      loadLikes();
      loadNets();
      syncNetButtons();
      const res = await fetch("manifest.json?ts=" + Date.now());
      DATA = await res.json();
      const all = DATA.items || [];
      const nStory = all.filter(isStory).length;
      const nMedia = all.length - nStory;
      const nPose = all.filter(it => it.pose).length;
      document.getElementById("count-badge").textContent = nMedia + " images · " + nPose + " with pose ref" + (nStory ? " · " + nStory + " story" : "");
      document.getElementById("updated-badge").textContent = "updated " + (DATA.updated || DATA.created || "");
      document.title = DATA.title || "Tigress thread gallery";
      document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.cat === filter));
      renderServices(DATA);
      render();
    }

    function renderServices(data) {
      const box = document.getElementById("services");
      if (!box) return;
      const raw = data.services;
      const list = Array.isArray(raw) ? raw : (raw && typeof raw === "object" ? Object.values(raw) : []);
      if (!list.length) {
        box.innerHTML = "";
        return;
      }
      box.innerHTML = list.map((s) => {
        const name = s.name || "service";
        const links = [
          s.url ? `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>` : escapeHtml(name),
          s.model_url ? `<a href="${escapeHtml(s.model_url)}" target="_blank" rel="noopener">модель</a>` : "",
          s.api ? `<a href="${escapeHtml(s.api)}" target="_blank" rel="noopener">API</a>` : "",
          s.docs ? `<a href="${escapeHtml(s.docs)}" target="_blank" rel="noopener">docs</a>` : ""
        ].filter(Boolean).join(" · ");
        const key = s.api_key
          ? `<div class="api-key">${s.key_name ? escapeHtml(s.key_name) + ": " : ""}<code>${escapeHtml(s.api_key)}</code></div>`
          : "";
        return `<div class="service">${links}${key}</div>`;
      }).join("");
    }

    document.getElementById("nav").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-cat]");
      if (!btn) return;
      filter = btn.dataset.cat;
      document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b === btn));
      if (filter === "story") history.replaceState(null, "", "#story");
      else if (location.hash === "#story" || location.hash === "#stories") history.replaceState(null, "", location.pathname);
      render();
    });

    document.getElementById("net-bar").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-net]");
      if (!btn) return;
      const k = btn.dataset.net;
      if (!NETS.includes(k)) return;
      netsOn[k] = !netsOn[k];
      saveNets();
      syncNetButtons();
      render();
    });

    const lb = document.getElementById("lb");
    const lbImg = document.getElementById("lb-img");
    function openLb(src) {
      lbImg.src = src;
      lb.classList.add("open");
      lb.setAttribute("aria-hidden", "false");
    }
    function closeLb() {
      lb.classList.remove("open");
      lb.setAttribute("aria-hidden", "true");
      lbImg.removeAttribute("src");
    }
    document.getElementById("lb-close").addEventListener("click", (e) => { e.stopPropagation(); closeLb(); });
    lb.addEventListener("click", closeLb);
    lbImg.addEventListener("click", (e) => e.stopPropagation());
    window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLb(); });
    setInterval(() => {
      document.querySelectorAll(".ago[data-ms]").forEach((el) => {
        const ms = Number(el.dataset.ms);
        if (ms) el.textContent = relativeAgo(ms);
      });
    }, 60000);

    load().catch(err => {
      document.getElementById("main").innerHTML = "<p style='color:#ff6b7a'>Failed to load manifest.json: " + escapeHtml(err.message) + "</p>";
    });
  </script>
</body>
</html>
